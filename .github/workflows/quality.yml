name: Quality baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/jlpt_exam
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/jlpt_exam
      SESSION_SECRET: ci-only-session-secret-not-used-at-runtime
      R2_ACCOUNT_ID: ci-placeholder
      R2_ACCESS_KEY_ID: ci-placeholder
      R2_SECRET_ACCESS_KEY: ci-placeholder
      R2_BUCKET: ci-placeholder
      R2_PUBLIC_BASE_URL: https://cdn.example.invalid
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx prisma validate
